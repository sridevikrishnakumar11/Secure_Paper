<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Successful | SecurePaper</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        a {
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            background: #2563eb;
        }

        a:hover {
            background: #1d4ed8;
        }

        .profile {
            background: #374151;
        }

        .profile:hover {
            background: #1f2937;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">✅</div>

        <h1>Upload Successful</h1>

        <p>
            Your question paper has been uploaded securely
            and is awaiting administrator approval.
        </p>

        <div class="buttons">
            <a href="/profile">My Profile</a>
            <a href="/upload" class="profile">Upload Another</a>
        </div>

    </div>

</body>
</html>
